# ============================================================================
# SAP_ADMS_CrewStatusAndIncidentUpdates_APPL Configuration
# User Defined Properties (UDP) File
# ============================================================================
# 
# This file contains all externalized configuration for the SAP-ADMS integration.
# Values should be overridden at deployment time based on environment.
#
# Deployment Example:
# mqsideploy <IntegrationNode> -e <IntegrationServer> -a app.bar \
#   -p SAP_ADMS_Config#adms.endpoint.url=https://adms-oms-prod.xcelenergy.com/ReceiveIncidentService
#
# ============================================================================

# ----------------------------------------------------------------------------
# ADMS/OMS SOAP Endpoints (OpCo-specific)
# ----------------------------------------------------------------------------
# These endpoints should be configured per environment (DEV/QA/PROD)
# Format: https://adms-oms-{opco}-{env}.xcelenergy.com/ReceiveIncidentService

# Northern States Power (NSP)
adms.nsp.endpoint=https://adms-oms-nsp-dev.xcelenergy.com/ReceiveIncidentService

# Public Service Company of Colorado (PSCO)
adms.psco.endpoint=https://adms-oms-psco-dev.xcelenergy.com/ReceiveIncidentService

# Southwestern Public Service (SPS)
adms.sps.endpoint=https://adms-oms-sps-dev.xcelenergy.com/ReceiveIncidentService

# Default endpoint (if OpCo not specified)
adms.default.endpoint=https://adms-oms-dev.xcelenergy.com/ReceiveIncidentService

# ----------------------------------------------------------------------------
# SOAP Service Configuration
# ----------------------------------------------------------------------------
# SOAP operation name
adms.soap.operation=ChangedIncident

# SOAP namespace
adms.soap.namespace=http://adms.oms.incident/v1

# SOAP action (if required)
adms.soap.action=urn:ChangedIncident

# ----------------------------------------------------------------------------
# Connection Timeout Configuration
# ----------------------------------------------------------------------------
# Timeout for SOAP requests (in seconds)
soap.timeout.seconds=30

# Connection timeout (in seconds)
soap.connection.timeout.seconds=10

# Read timeout (in seconds)
soap.read.timeout.seconds=30

# Retry configuration
soap.retry.enabled=true
soap.retry.count=3
soap.retry.interval.seconds=5

# ----------------------------------------------------------------------------
# TLS/SSL Configuration
# ----------------------------------------------------------------------------
# TLS protocol version
tls.protocol=TLSv1.2

# Allowed cipher suites (comma-separated)
tls.ciphers=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# Certificate validation
tls.validate.certificate=true
tls.validate.hostname=true

# Keystore configuration (references ACE keystore)
tls.keystore.alias=aceKeyStore
tls.truststore.alias=aceTrustStore

# ----------------------------------------------------------------------------
# Security Configuration
# ----------------------------------------------------------------------------
# Security identity name (configured via mqsisetdbparms)
security.identity.name=adms::credentials

# Authentication type
security.auth.type=BASIC

# Token expiry (if using token-based auth)
security.token.expiry.minutes=60

# ----------------------------------------------------------------------------
# HTTP Input Configuration
# ----------------------------------------------------------------------------
# HTTP listener port (if not using default)
http.listener.port=7843

# HTTP path prefix
http.path.prefix=/sap-adms/v1

# Enable HTTPS
http.enable.https=true

# ----------------------------------------------------------------------------
# Message Size Limits
# ----------------------------------------------------------------------------
# Maximum request size (in bytes)
message.max.request.size=1048576

# Maximum response size (in bytes)
message.max.response.size=1048576

# ----------------------------------------------------------------------------
# Logging and Monitoring Configuration
# ----------------------------------------------------------------------------
# Enable audit logging
audit.logging.enabled=true

# Log level (ERROR, WARN, INFO, DEBUG)
log.level=INFO

# Enable performance monitoring
monitoring.enabled=true

# Transaction ID prefix
transaction.id.prefix=SAP_ADMS

# ----------------------------------------------------------------------------
# Error Handling Configuration
# ----------------------------------------------------------------------------
# Enable automatic retry on failure
error.retry.enabled=true

# Maximum retry attempts
error.retry.max.attempts=3

# Retry delay (in milliseconds)
error.retry.delay.ms=1000

# Enable dead letter queue
error.dlq.enabled=false

# Dead letter queue name
error.dlq.name=SAP_ADMS_DLQ

# ----------------------------------------------------------------------------
# Business Rules Configuration
# ----------------------------------------------------------------------------
# Valid OpCo codes (comma-separated)
business.valid.opcos=NSP,PSCO,SPS

# Valid crew status values (comma-separated)
business.valid.crew.status=EN_ROUTE,ON_SITE,IN_PROGRESS,COMPLETED,CANCELLED

# Valid resolution codes (comma-separated)
business.valid.resolution.codes=EQUIPMENT_REPLACED,EQUIPMENT_REPAIRED,FUSE_REPLACED,BREAKER_RESET,TREE_REMOVED,CABLE_REPAIRED,OTHER

# Incident ID pattern (regex)
business.incident.id.pattern=^[A-Z]{3}-[0-9]{5,10}$

# Crew ID pattern (regex)
business.crew.id.pattern=^CREW-[0-9]{3,6}$

# ----------------------------------------------------------------------------
# Environment-Specific Overrides
# ----------------------------------------------------------------------------
# These values should be overridden at deployment time

# Environment name (DEV, QA, PROD)
environment.name=DEV

# Environment-specific logging
environment.dev.log.level=DEBUG
environment.qa.log.level=INFO
environment.prod.log.level=WARN

# Environment-specific timeouts
environment.dev.soap.timeout.seconds=60
environment.qa.soap.timeout.seconds=45
environment.prod.soap.timeout.seconds=30

# ----------------------------------------------------------------------------
# APIC Gateway Configuration (for reference)
# ----------------------------------------------------------------------------
# APIC gateway URL (used by SAP to invoke)
apic.gateway.url=https://apic-gateway-dev.xcelenergy.com

# APIC OAuth token URL
apic.oauth.url=https://apic-gateway-dev.xcelenergy.com/oauth2/token

# APIC client credentials (configured in APIC, not in ACE)
# apic.client.id=<configured-in-apic>
# apic.client.secret=<configured-in-apic>

# ----------------------------------------------------------------------------
# Feature Flags
# ----------------------------------------------------------------------------
# Enable/disable specific features

# Enable crew status updates
feature.crew.status.enabled=true

# Enable ETR updates
feature.etr.update.enabled=true

# Enable incident comments
feature.incident.comments.enabled=true

# Enable incident resolution
feature.incident.resolution.enabled=true

# Enable enhanced validation
feature.enhanced.validation.enabled=true

# Enable request/response logging (disable in production)
feature.payload.logging.enabled=false

# ----------------------------------------------------------------------------
# Performance Tuning
# ----------------------------------------------------------------------------
# Thread pool size
performance.thread.pool.size=10

# Connection pool size
performance.connection.pool.size=20

# Cache configuration
performance.cache.enabled=true
performance.cache.size=1000
performance.cache.ttl.seconds=300

# ----------------------------------------------------------------------------
# Compliance and Audit
# ----------------------------------------------------------------------------
# Enable NERC CIP compliance logging
compliance.nerc.cip.enabled=true

# Enable SOX compliance audit trail
compliance.sox.enabled=true

# Data retention period (in days)
compliance.data.retention.days=2555

# Enable PII masking in logs
compliance.pii.masking.enabled=true

# ----------------------------------------------------------------------------
# Notes for Deployment
# ----------------------------------------------------------------------------
# 
# DEV Environment:
# - Use *-dev.xcelenergy.com endpoints
# - Enable debug logging
# - Enable payload logging for troubleshooting
# - Longer timeouts for testing
#
# QA Environment:
# - Use *-qa.xcelenergy.com endpoints
# - INFO level logging
# - Disable payload logging
# - Standard timeouts
#
# PROD Environment:
# - Use *-prod.xcelenergy.com endpoints
# - WARN level logging
# - Disable payload logging
# - Optimized timeouts
# - Enable all compliance features
# - Enable monitoring and alerting
#
# ============================================================================

